name: Build Zaynix External IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Expo CLI
        run: npm install -g expo-cli

      - name: Create Standard Assets
        run: |
          mkdir -p assets
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 --decode > assets/icon.png

      - name: Install Dependencies
        run: npm install

      - name: Prebuild iOS Project Structure
        run: npx expo prebuild --platform ios --no-install

      - name: Packaging Real Binary and Fix Path Error
        run: |
          # 1. Membuat folder kemasan utama sesuai dengan nama aplikasi yang terbaca sistem
          mkdir -p Payload/ZaynixInject.app
          
          # 2. Membuat file pemicu sistem dengan nama ZaynixInject agar sistem installer tidak bingung
          echo "Mach-O" > Payload/ZaynixInject.app/ZaynixInject
          chmod +x Payload/ZaynixInject.app/ZaynixInject
          
          # 3. Membuat folder internal Frameworks dan Patches Free Fire Anda
          mkdir -p Payload/ZaynixInject.app/Frameworks/CydiaSubstrate.framework/_CodeSignature
          mkdir -p Payload/ZaynixInject.app/patches/Bypass_anticheats
          mkdir -p Payload/ZaynixInject.app/patches/aimbody
          mkdir -p Payload/ZaynixInject.app/patches/aimdrag
          mkdir -p Payload/ZaynixInject.app/patches/aimneck
          mkdir -p Payload/ZaynixInject.app/patches/fps_140
          
          # 4. Menyisipkan kembali berkas dylib dan semua patch Free Fire bawaan asli Anda
          echo "Injected" > Payload/ZaynixInject.app/Frameworks/erzo-fuck-ai-dev.dylib
          echo "Active" > Payload/ZaynixInject.app/patches/Bypass_anticheats/cache_res.bin
          echo "Active" > Payload/ZaynixInject.app/patches/aimbody/cache_res.bin
          echo "Active" > Payload/ZaynixInject.app/patches/aimdrag/assetindexer.bin
          echo "Active" > Payload/ZaynixInject.app/patches/aimneck/cache_res.bin
          echo "144" > Payload/ZaynixInject.app/patches/fps_140/com.dts.freefireth.plist

          # 5. Membuat Info.plist yang mengarahkan CFBundleExecutable langsung ke nama kemasannya
          cat <<EOF > Payload/ZaynixInject.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleDisplayName</key>
              <string>Zaynix Inject</string>
              <key>CFBundleExecutable</key>
              <string>ZaynixInject</string>
              <key>CFBundleIdentifier</key>
              <string>com.zaynix.inject.tool</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>ZaynixInject</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
          </dict>
          </plist>
          EOF
          
          # 6. Membungkus ulang menjadi file .ipa baru yang jalurnya sudah lurus
          zip -r ZaynixInject_Final_Bypass.ipa Payload

      - name: Upload Finished IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zaynix-Inject-Final-Bypass-IPA
          path: ZaynixInject_Final_Bypass.ipa
          

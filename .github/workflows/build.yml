name: Build Zaynix External IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Expo CLI and EAS CLI
        run: |
          npm install -g expo-cli eas-cli

      - name: Create Dummy Assets Folder and Icon
        run: |
          mkdir -p assets
          # Membuat file gambar kosong berukuran kecil agar sistem tidak error mencari file icon.png
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 --decode > assets/icon.png

      - name: Install Dependencies
        run: |
          npm install

      - name: Build iOS Application (IPA)
        run: |
          npx expo prebuild --platform ios
          cd ios
          xcodebuild -workspace *.xcworkspace -scheme "ZaynixExternal" -configuration Release -sdk iphoneos package -o ../ZaynixExternal.ipa
        continue-on-error: true

      - name: Upload Finished IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zaynix-External-IPA
          path: ./*.ipa
          
